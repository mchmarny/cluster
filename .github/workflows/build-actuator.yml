name: Build Actuator Image

on:
  push:
    tags:
      - 'v*-eks'
      - 'v*-gke'
      - 'v*-aks'
      - 'v*-oke'

env:
  REGISTRY: ghcr.io
  TERRAFORM_VERSION: "1.13.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          # v1.0.0-eks → VERSION=v1.0.0, CSP=eks
          CSP="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "csp=$CSP" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ github.repository }}/${CSP}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate CSP directory exists
        run: |
          if [[ ! -d "${{ steps.parse.outputs.csp }}/terraform" ]]; then
            echo "Error: Directory ${{ steps.parse.outputs.csp }}/terraform does not exist"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Mirror Terraform dependencies
        run: |
          chmod +x ./tools/mirror
          ./tools/mirror ${{ steps.parse.outputs.csp }}

      - name: Validate mirrored Terraform
        run: |
          # Create local terraformrc pointing to actual provider path
          cat > /tmp/terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$(pwd)/mirror/providers"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
          export TF_CLI_CONFIG_FILE=/tmp/terraformrc
          cd mirror/terraform
          terraform init -backend=false
          terraform validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.parse.outputs.image }}
          tags: |
            type=raw,value=${{ steps.parse.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: images/${{ steps.parse.outputs.csp }}.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate attestation
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ${{ steps.parse.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CSP | ${{ steps.parse.outputs.csp }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.parse.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | ${{ steps.push.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
