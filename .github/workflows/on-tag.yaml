name: Build Actuator Image

on:
  push:
    branches: [main]
    tags:
      - 'v*-eks'
      - 'v*-gke'

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ===========================================================================
  # Qualify: reusable Go + Terraform quality checks
  # ===========================================================================

  qualify:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/qualify.yml
    permissions:
      contents: read

  # ===========================================================================
  # Build: native per-arch images (parallel)
  # ===========================================================================

  build:
    needs: [qualify]
    if: startsWith(github.ref, 'refs/tags/')
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT

      - name: Validate provider directory exists
        env:
          PROVIDER: ${{ steps.parse.outputs.provider }}
        run: |
          if [[ ! -d "provider/${PROVIDER}/terraform" ]]; then
            echo "::error::Directory provider/${PROVIDER}/terraform does not exist"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Mirror Terraform dependencies
        env:
          PROVIDER: ${{ steps.parse.outputs.provider }}
        run: |
          chmod +x ./tools/mirror
          ./tools/mirror "$PROVIDER"

      - name: Validate mirrored Terraform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cat > /tmp/terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$(pwd)/mirror/providers/${ARCH}"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
          export TF_CLI_CONFIG_FILE=/tmp/terraformrc
          cd mirror/terraform
          terraform init -backend=false
          terraform validate

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: image/${{ steps.parse.outputs.provider }}.dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ steps.parse.outputs.provider }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.parse.outputs.provider }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.parse.outputs.version }}
            COMMIT=${{ github.sha }}
            TERRAFORM_VERSION=${{ steps.versions.outputs.terraform }}
            KUBECTL_VERSION=${{ steps.versions.outputs.kubectl }}
            AWSCLI_VERSION=${{ steps.versions.outputs.awscli }}
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.parse.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ===========================================================================
  # Manifest: combine per-arch images into multi-arch manifest
  # ===========================================================================

  manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ steps.parse.outputs.image }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          docker buildx imagetools create -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

  # ===========================================================================
  # Vulnerability scan: scan multi-arch image after manifest is published
  # ===========================================================================

  image-vuln-scan:
    name: Image Vuln Scan
    runs-on: ubuntu-latest
    needs: [manifest]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan container image
        id: trivy
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # v0.34.1
        env:
          TRIVY_IGNOREFILE: .trivyignore
        with:
          scan-type: 'image'
          image-ref: '${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}'
          scanners: 'vuln'
          ignore-unfixed: true
          format: 'sarif'
          output: 'image-scan-results.sarif'
          severity: '${{ steps.versions.outputs.scan_severity }}'
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: hashFiles('image-scan-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: image-scan-results.sarif
          category: 'trivy-image-${{ steps.parse.outputs.image }}'
        continue-on-error: true

      - name: Fail on vulnerabilities
        if: steps.trivy.outcome == 'failure'
        env:
          IMAGE_REF: '${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}'
        run: |
          set -euo pipefail
          echo "::error::Vulnerability scan found issues in ${IMAGE_REF}"
          echo "Check the Security tab for details."
          exit 1

  # ===========================================================================
  # Attestation: provenance + SBOM after scan passes
  # ===========================================================================

  attest:
    name: Attest
    runs-on: ubuntu-latest
    needs: [image-vuln-scan]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get manifest digest
        id: digest
        env:
          IMAGE: ${{ steps.parse.outputs.image }}
          VERSION: ${{ steps.parse.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ steps.parse.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # ===========================================================================
  # Summary
  # ===========================================================================

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [qualify, build, manifest, image-vuln-scan, attest]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
          QUALIFY: ${{ needs.qualify.result }}
          BUILD: ${{ needs.build.result }}
          MANIFEST: ${{ needs.manifest.result }}
          VULN_SCAN: ${{ needs.image-vuln-scan.result }}
          ATTEST: ${{ needs.attest.result }}
        run: |
          set -euo pipefail
          {
            echo "## Build Summary"
            echo ""
            echo "**Tag:** \`${TAG}\`"
            echo ""
            echo "| Phase | Result |"
            echo "|-------|--------|"
            echo "| Qualify (Go + Terraform) | ${QUALIFY} |"
            echo "| Build (amd64 + arm64) | ${BUILD} |"
            echo "| Multi-arch Manifest | ${MANIFEST} |"
            echo "| Vulnerability Scan | ${VULN_SCAN} |"
            echo "| Attestation | ${ATTEST} |"
          } >> "$GITHUB_STEP_SUMMARY"
