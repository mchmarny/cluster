name: Build Actuator Image

on:
  push:
    branches: [main]
    tags:
      - 'v*-eks'
      - 'v*-gke'
      - 'v*-aks'

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ===========================================================================
  # Qualify: reusable Go + Terraform quality checks
  # ===========================================================================

  qualify:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/qualify.yml
    permissions:
      contents: read

  # ===========================================================================
  # Build: native per-arch images (parallel)
  # ===========================================================================

  build:
    needs: [qualify]
    if: startsWith(github.ref, 'refs/tags/')
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT

      - name: Validate provider directory exists
        env:
          PROVIDER: ${{ steps.parse.outputs.provider }}
        run: |
          if [[ ! -d "provider/${PROVIDER}/terraform" ]]; then
            echo "::error::Directory provider/${PROVIDER}/terraform does not exist"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Mirror Terraform dependencies
        env:
          PROVIDER: ${{ steps.parse.outputs.provider }}
        run: |
          chmod +x ./tools/mirror
          ./tools/mirror "$PROVIDER"

      - name: Validate mirrored Terraform
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cat > /tmp/terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "$(pwd)/mirror/providers/${ARCH}"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
          export TF_CLI_CONFIG_FILE=/tmp/terraformrc
          cd mirror/terraform
          terraform init -backend=false
          terraform validate

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: image/${{ steps.parse.outputs.provider }}.dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ steps.parse.outputs.provider }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.parse.outputs.provider }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.parse.outputs.version }}
            COMMIT=${{ github.sha }}
            TERRAFORM_VERSION=${{ steps.versions.outputs.terraform }}
            KUBECTL_VERSION=${{ steps.versions.outputs.kubectl }}
            AWSCLI_VERSION=${{ steps.versions.outputs.awscli }}
            GCLOUD_VERSION=${{ steps.versions.outputs.gcloud }}
            AZURECLI_VERSION=${{ steps.versions.outputs.azurecli }}
            KUBELOGIN_VERSION=${{ steps.versions.outputs.kubelogin }}
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.parse.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ===========================================================================
  # Manifest: combine per-arch images into multi-arch manifest
  # ===========================================================================

  manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Create multi-arch manifest
        env:
          IMAGE: ${{ steps.parse.outputs.image }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

          docker buildx imagetools create -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

  # ===========================================================================
  # Vulnerability scan: scan multi-arch image after manifest is published
  # ===========================================================================

  image-vuln-scan:
    name: Image Vuln Scan
    runs-on: ubuntu-latest
    needs: [manifest]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install grype
        env:
          GRYPE_VERSION: ${{ steps.versions.outputs.grype }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"
          grype version

      - name: Scan container image
        id: grype
        env:
          IMAGE_REF: '${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}'
        run: |
          set -euo pipefail
          # --vex applies OpenVEX statements with per-CVE reachability
          # evidence for bundled-binary CVEs (Python in gcloud/AWS CLI,
          # Go stdlib + x/net in terraform). See .openvex.json.
          grype "${IMAGE_REF}" \
            --config .grype.yaml \
            --vex .openvex.json \
            --only-fixed \
            --fail-on critical \
            --output table \
            --output sarif=image-scan-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: hashFiles('image-scan-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: image-scan-results.sarif
          category: 'grype-image-${{ steps.parse.outputs.image }}'
        continue-on-error: true

      - name: Fail on vulnerabilities
        if: steps.grype.outcome == 'failure'
        env:
          IMAGE_REF: '${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}'
        run: |
          set -euo pipefail
          echo "::error::Vulnerability scan found issues in ${IMAGE_REF}"
          echo "Check the Security tab for details."
          exit 1

  # ===========================================================================
  # Attestation: provenance + SBOM after scan passes
  # ===========================================================================

  attest:
    name: Attest
    runs-on: ubuntu-latest
    needs: [image-vuln-scan]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROVIDER="${TAG##*-}"
          VERSION="${TAG%-*}"
          echo "image=${{ steps.versions.outputs.registry }}/${{ github.repository }}/${PROVIDER}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ steps.versions.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get manifest digest
        id: digest
        env:
          IMAGE: ${{ steps.parse.outputs.image }}
          VERSION: ${{ steps.parse.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw | sha256sum | awk '{print "sha256:"$1}')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ steps.parse.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # ===========================================================================
  # Summary
  # ===========================================================================

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [qualify, build, manifest, image-vuln-scan, attest]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
          QUALIFY: ${{ needs.qualify.result }}
          BUILD: ${{ needs.build.result }}
          MANIFEST: ${{ needs.manifest.result }}
          VULN_SCAN: ${{ needs.image-vuln-scan.result }}
          ATTEST: ${{ needs.attest.result }}
        run: |
          set -euo pipefail
          {
            echo "## Build Summary"
            echo ""
            echo "**Tag:** \`${TAG}\`"
            echo ""
            echo "| Phase | Result |"
            echo "|-------|--------|"
            echo "| Qualify (Go + Terraform) | ${QUALIFY} |"
            echo "| Build (amd64 + arm64) | ${BUILD} |"
            echo "| Multi-arch Manifest | ${MANIFEST} |"
            echo "| Vulnerability Scan | ${VULN_SCAN} |"
            echo "| Attestation | ${ATTEST} |"
          } >> "$GITHUB_STEP_SUMMARY"
