name: Qualify

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ===========================================================================
  # Go: vet, fmt, test, build (no external tool deps)
  # ===========================================================================

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - name: Vet, fmt, test, build
        run: make go-vet go-fmt go-test go-build

  # ===========================================================================
  # Go: lint (separate job — golangci-lint is slow)
  # ===========================================================================

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}

      # Prebuilt release binary, not `go install`: building from source
      # resolves ~200 transitive modules with no go.sum to verify against,
      # so every run depends on sum.golang.org staying up. Checksum
      # verification replaces the integrity guarantee the sumdb provided.
      - name: Install golangci-lint
        run: |
          VERSION="${{ steps.versions.outputs.golangci_lint }}"
          VERSION="${VERSION#v}"
          NAME="golangci-lint-${VERSION}-linux-amd64"
          BASE="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"
          curl -fsSL --retry 3 --retry-all-errors -o "/tmp/${NAME}.tar.gz" "${BASE}/${NAME}.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/golangci-checksums.txt "${BASE}/golangci-lint-${VERSION}-checksums.txt"
          (cd /tmp && grep " ${NAME}.tar.gz\$" golangci-checksums.txt | sha256sum -c -)
          sudo tar xzf "/tmp/${NAME}.tar.gz" -C /usr/local/bin --strip-components=1 "${NAME}/golangci-lint"
          rm -f "/tmp/${NAME}.tar.gz" /tmp/golangci-checksums.txt

      - name: Lint
        run: make go-lint

  # ===========================================================================
  # Terraform: validate, lint, fmt
  # ===========================================================================

  tf-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v${{ steps.versions.outputs.tflint }}

      # Rulesets ship only as GitHub Releases; caching avoids the download
      # (and its API call) entirely on repeat runs
      - name: Cache tflint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-plugins-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

      - name: Install Trivy
        run: |
          TRIVY_VERSION="${{ steps.versions.outputs.trivy }}"
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -O /tmp/trivy.tar.gz
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm /tmp/trivy.tar.gz

      - name: Qualify
        env:
          # tflint --init resolves ruleset releases via the GitHub API;
          # unauthenticated calls share a 60/hr per-IP quota across all
          # tenants on hosted runners and get rate-limited (403)
          GITHUB_TOKEN: ${{ github.token }}
        run: make tf-qualify
