name: Qualify

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ===========================================================================
  # Go: vet, fmt, test, build (no external tool deps)
  # ===========================================================================

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - name: Vet, fmt, test, build
        run: make go-vet go-fmt go-test go-build

  # ===========================================================================
  # Go: lint (separate job — golangci-lint is slow)
  # ===========================================================================

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.versions.outputs.golangci_lint }}

      - name: Lint
        run: make go-lint

  # ===========================================================================
  # Terraform: validate, lint, fmt
  # ===========================================================================

  tf-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v${{ steps.versions.outputs.tflint }}

      # Rulesets ship only as GitHub Releases; caching avoids the download
      # (and its API call) entirely on repeat runs
      - name: Cache tflint plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-plugins-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

      - name: Install Trivy
        run: |
          TRIVY_VERSION="${{ steps.versions.outputs.trivy }}"
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -O /tmp/trivy.tar.gz
          sudo tar xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          rm /tmp/trivy.tar.gz

      - name: Qualify
        env:
          # tflint --init resolves ruleset releases via the GitHub API;
          # unauthenticated calls share a 60/hr per-IP quota across all
          # tenants on hosted runners and get rate-limited (403)
          GITHUB_TOKEN: ${{ github.token }}
        run: make tf-qualify
