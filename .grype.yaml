# Image vulnerability scan policy.
#
# Per-CVE suppressions live in .openvex.json (OpenVEX v0.2.0) and are passed
# into grype via the workflow's `--vex` flag (see .github/workflows/on-tag.yaml).
# This file carries only scan-time configuration (paths to exclude).
#
# When scanning locally, run:
#   grype <image> -c .grype.yaml --vex .openvex.json

exclude:
  - '**/.terraform/**'
