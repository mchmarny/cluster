apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: d1
  tenancy: "00000000-0000-0000-0000-000000000000"  # Azure subscription ID
  location: eastus
  tags:
    owner: mchmarny
    env: dev
  azure:
    resourceGroup: "rg-aks-demo"

cluster:
  name: demo
  version: "1.30"
  controlPlane:
    authorizedIpRanges:
      - 1.2.3.4/32  # Replace with your CIDR
  maintenance:
    allowed:
      - day: Sunday
        hours: [1, 2, 3, 4, 5]

# Network uses defaults: 10.0.0.0/16 VNet, auto-computed subnets
# Uncomment to customize:
# network:
#   vnetAddressSpace: 10.0.0.0/16
#   systemSubnetCidr: 10.0.1.0/24
#   workerSubnetCidr: 10.0.2.0/24
#   podSubnetCidr: 10.0.16.0/20

compute:
  nodePools:
    system:
      type: system
      mode: System
      vmSize: Standard_D4s_v5
      nodeCount: 3
      enableAutoScaling: true
      minCount: 2
      maxCount: 10

    worker:
      type: worker
      mode: User
      vmSize: Standard_D8s_v5
      nodeCount: 2
      enableAutoScaling: true
      minCount: 1
      maxCount: 20

    # GPU node pool (optional)
    # gpu:
    #   type: worker
    #   mode: User
    #   vmSize: Standard_NC6s_v3
    #   nodeCount: 0
    #   enableAutoScaling: true
    #   minCount: 0
    #   maxCount: 5
