apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: d1
  provider: eks
  tenancy: "123456789101"    # AWS account ID
  location: us-east-1
  tags:
    owner: mchmarny
    env: dev

cluster:
  name: demo
  version: "1.33"
  addOns:  # empty version defaults to latest
    coreDns: ""
    vpcCni: ""
    kubeProxy: ""
    cloudwatchObservability: ""
    ebsCsi: ""
  controlPlane:
    allowedCidrs:
      - 1.2.3.4/32
  adminRoles:
    - ClusterAdmin

# Network uses defaults: 10.0.0.0/16 VPC, 100.65.0.0/16 pods
# Subnets must be explicitly defined due to zone requirements
network:
  cidrs:
    host: 10.0.0.0/16
    pod: 100.65.0.0/16
  subnets:
    public:
      - cidr: 10.0.1.0/27
        zone: us-east-1a
      - cidr: 10.0.2.0/27
        zone: us-east-1b
    system:
      - cidr: 10.0.4.0/22
        zone: us-east-1a
      - cidr: 10.0.8.0/22
        zone: us-east-1c
    worker:
      - cidr: 10.0.128.0/17
        zone: us-east-1-dfw-2a
        disableEndpoints: true
    pod:
      - cidr: 100.65.0.0/16
        zone: us-east-1-dfw-2a
        disableEndpoints: true

compute:
  sshPublicKey: "ssh-ed25519 AAAA..."  # Replace with your SSH public key

  nodeGroups:
    system:
      instanceType: t3.xlarge
      imageId: ami-0b72f4a84c39bcd30  # Ubuntu EKS AMI (amd64)
      capacity:
        desired: 3
        min: 3
        max: 6

    workers:
      - name: amd-cpu-worker-1
        instanceType: m6i.xlarge
        imageId: ami-0b72f4a84c39bcd30
        capacity:
          desired: 1
        labels:
          nodeGroup: cpu-worker

      # GPU worker (optional)
      # - name: gpu-worker-1
      #   instanceType: p4d.24xlarge
      #   gpuType: a100
      #   imageId: ami-0b68ba66e5a106899
      #   capacity:
      #     desired: 0
