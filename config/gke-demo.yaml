apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: d1
  provider: gke
  tenancy: "my-project"  # GCP project ID
  location: europe-west4
  state: tenancy
  destroy: false
  tags:
    owner: mchmarny
    env: dev

cluster:
  gke:
    name: demo
    version: "1.33"
    releaseChannel: STABLE
    controlPlane:
      authorizedNetworks:
        - cidr: 1.2.3.0/27
          name: nyc-office
        - cidr: 5.6.7.8/32
          name: lon-office
    maintenance:
      window:
        startTime: "03:00"

# Network uses defaults: 10.0.0.0/16 VPC, auto-computed subnets and secondary ranges
# Uncomment to customize:
# network:
#   gke:
#     cidr: 10.0.0.0/16
#     subnets:
#       nodes:
#         - name: system-subnet
#           cidr: 10.0.0.0/22
#         - name: worker-subnet
#           cidr: 10.0.128.0/17

compute:
  gke:
    nodePools:
      system:
        machineType: e2-standard-4
        autoscaling:
          enabled: true
          minNodes: 1
          maxNodes: 3

      workers:
        - name: cpu-worker-1
          machineType: n2-standard-8
          diskType: pd-ssd
          diskSizeGb: 200
          autoscaling:
            enabled: true
            minNodes: 1
            maxNodes: 5
          nodeConfig:
            labels:
              nodeGroup: cpu-worker

        # Additional worker pools (optional)
        # - name: gpu-worker
        #   machineType: n1-standard-4
        #   accelerators:
        #     - type: nvidia-tesla-t4
        #       count: 1
        #   autoscaling:
        #     enabled: true
        #     minNodes: 0
        #     maxNodes: 3
