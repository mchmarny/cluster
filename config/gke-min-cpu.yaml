apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: mini
  provider: gke
  tenancy: eidosx
  location: us-central1
  state: tenancy
  destroy: false
  tags:
    env: demo

cluster:
  gke:
    version: "1.33"
    releaseChannel: STABLE
    controlPlane:
      authorizedNetworks:
        - cidr: 216.228.127.128/30
          name: hq
        - cidr: 52.41.222.58/32
          name: nw1
        - cidr: 54.68.11.139/32
          name: nw2
    maintenance:
      window:
        startTime: "03:00"

compute:
  gke:
    nodePools:
      system:
        machineType: e2-standard-4
        autoscaling:
          enabled: true
          minNodes: 1
          maxNodes: 3

      workers:
        - name: cpu-worker
          machineType: n2-standard-8
          diskType: pd-ssd
          diskSizeGb: 200
          autoscaling:
            enabled: true
            minNodes: 1
            maxNodes: 1
          nodeConfig:
            labels:
              nodeGroup: cpu-worker

        # GPU worker example:
        # - name: gpu-worker
        #   machineType: n1-standard-4
        #   accelerators:
        #     - type: nvidia-tesla-t4
        #       count: 1
        #   autoscaling:
        #     enabled: true
        #     minNodes: 0
        #     maxNodes: 3
