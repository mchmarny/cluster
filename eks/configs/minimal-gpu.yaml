apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

# Minimal EKS configuration - only required fields
# All other settings use sensible defaults from Terraform

deployment:
  id: demo
  tenancy: "123456789012"    # AWS account ID
  location: us-east-1

cluster:
  controlPlane:
    allowedCidrs:            # CIDRs allowed to access control plane
      - 1.2.3.4/32           # Replace with your IP

compute:
  sshPublicKey: "ssh-ed25519 AAAA..."  # Replace with your SSH public key

  nodeGroups:
    system:
      instanceType: m6i.xlarge
      imageId: ami-0b72f4a84c39bcd30  # Ubuntu EKS AMI (amd64)
      capacity:
          desired: 3

    workers:
      - instanceType: p6e-gb200.36xlarge
        imageId: ami-0b72f4a84c39bcd30
        capacity:
          desired: 1
          reservation:  # example of capacity reservation usage
            marketType: capacity-block
            preference: capacity-reservations-only
            resourceGroup: demo-gb200-rg  # arn derived form account id and region
        labels:
          nodeGroup: gpu-worker