apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

# Minimal GKE configuration - only required fields
# All other settings use sensible defaults from Terraform

deployment:
  id: demo
  tenancy: "my-project-id"  # GCP project ID
  location: us-central1

cluster:
  controlPlane:
    authorizedNetworks:      # CIDRs allowed to access control plane
      - cidr: 1.2.3.4/32     # Replace with your IP
        name: my-network
