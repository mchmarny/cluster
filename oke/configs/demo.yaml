apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: d1
  tenancy: "ocid1.tenancy.oc1..aaaaaaaXXXXXXXX"  # OCI tenancy OCID
  location: us-ashburn-1
  tags:
    owner: mchmarny
    env: dev
  oci:
    compartment: "ocid1.compartment.oc1..aaaaaaaXXXXXXXX"  # OCI compartment OCID

cluster:
  name: demo
  version: "v1.33.1"
  controlPlane:
    allowedCidrs:
      - 1.2.3.4/32  # Replace with your CIDR

# Network uses defaults: 10.0.0.0/16 VCN, 100.65.0.0/16 pods, auto-computed subnets
# Uncomment to customize:
# network:
#   cidrs:
#     host: 10.0.0.0/16
#     pod: 100.65.0.0/16

compute:
  sshPublicKey: "ssh-ed25519 AAAA..."  # Replace with SSH public key

  nodePools:
    system:
      type: system
      shape: VM.Standard.E5.Flex
      ocpus: 2
      memoryGb: 16
      size: 3
      autoscaling:
        enabled: true
        minSize: 2
        maxSize: 10

    worker:
      type: worker
      shape: VM.Standard.E5.Flex
      ocpus: 4
      memoryGb: 32
      size: 2
      autoscaling:
        enabled: true
        minSize: 1
        maxSize: 20

    # GPU node pool (optional)
    # gpu:
    #   type: worker
    #   shape: VM.GPU.A10.1
    #   size: 1
    #   autoscaling:
    #     enabled: true
    #     minSize: 0
    #     maxSize: 5
