apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

# Minimal OKE configuration - only required fields
# All other settings use sensible defaults from Terraform
# Note: Your current IP is automatically added to API server allowed CIDRs

deployment:
  id: demo
  tenancy: "ocid1.tenancy.oc1..aaaaaaaXXXXXXXX"  # OCI tenancy OCID
  location: us-ashburn-1
  oci:
    compartment: "ocid1.compartment.oc1..aaaaaaaXXXXXXXX"  # OCI compartment OCID

compute:
  sshPublicKey: "ssh-ed25519 AAAA..."  # Replace with your SSH public key
