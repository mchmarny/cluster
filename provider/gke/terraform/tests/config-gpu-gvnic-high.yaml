# Test fixture for terraform test (tests/*.tftest.hcl) — not a deployable config.
# gpuNets.gvnicCidr on a GPU machine type other than a3-megagpu-8g must still
# plan and attach the extra gVNIC network.
apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: tftest
  provider: gke
  tenancy: tftest-project
  location: us-central1
  state: tenancy
  destroy: false

cluster:
  gke:
    version: "1.35"

network:
  gke:
    gpuNets:
      count: 4
      cidrBase: "192.168.0.0/16"
      gvnicCidr: "192.168.128.0/20"

compute:
  gke:
    nodePools:
      system:
        machineType: e2-standard-4

      workers:
        - name: gpu-worker
          machineType: a3-highgpu-8g
          diskType: pd-ssd
          zones:
            - us-central1-a
          guestAccelerator:
            type: nvidia-h100-80gb
            count: 8
          nodeConfig:
            gvnic: true
