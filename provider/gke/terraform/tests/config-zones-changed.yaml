# Test fixture for terraform test (tests/*.tftest.hcl) — not a deployable config.
# config-zones.yaml with a different zone and default-pool machine type. Planned
# over config-zones.yaml state, the cluster must plan no change: both fields
# are create-time only.
apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: tftest
  provider: gke
  tenancy: tftest-project
  location: us-central1
  state: tenancy
  destroy: false

cluster:
  gke:
    version: "1.35"
    zones:
      - us-central1-b
    defaultPool:
      machineType: e2-standard-8

compute:
  gke:
    nodePools:
      system:
        machineType: e2-standard-4
