# Test fixture for terraform test (tests/*.tftest.hcl) — not a deployable config.
# Explicit empty cluster.gke.zones (as in the README config reference) must
# behave like unset: plan passes and GKE picks the zones.
apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: tftest
  provider: gke
  tenancy: tftest-project
  location: us-central1
  state: tenancy
  destroy: false

cluster:
  gke:
    version: "1.35"
    zones: []

compute:
  gke:
    nodePools:
      system:
        machineType: e2-standard-4
