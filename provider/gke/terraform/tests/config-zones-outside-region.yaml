# Test fixture for terraform test (tests/*.tftest.hcl) — not a deployable config.
# cluster.gke.zones names a zone outside deployment.location; plan must fail
# before any resource is created.
apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: tftest
  provider: gke
  tenancy: tftest-project
  location: us-central1
  state: tenancy
  destroy: false

cluster:
  gke:
    version: "1.35"
    zones:
      - us-central1-c
      - us-east1-b

compute:
  gke:
    nodePools:
      system:
        machineType: e2-standard-4
