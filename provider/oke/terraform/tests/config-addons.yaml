apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: tftest
  provider: oke
  tenancy: ocid1.tenancy.oc1..tftest
  location: us-chicago-1
  state: local

cluster:
  oke:
    version: v1.36.4
    compartmentId: ocid1.compartment.oc1..tftest
    addons:
      NvidiaGpuPlugin:
        deviceListStrategy: volume-mounts
        failOnInitError: true

compute:
  oke:
    nodePoolEviction:
      gracePeriod: PT15M
      forceDelete: true
    nodePools:
      system:
        shape: VM.Standard.E5.Flex
        size: 1
