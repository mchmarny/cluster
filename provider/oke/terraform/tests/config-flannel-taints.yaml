apiVersion: github.com/mchmarny/cluster/v1alpha1
kind: Cluster

deployment:
  id: tftest
  provider: oke
  tenancy: ocid1.tenancy.oc1..tftest
  location: us-chicago-1
  state: local

cluster:
  oke:
    version: v1.36.4
    compartmentId: ocid1.compartment.oc1..tftest
    cni: flannel

compute:
  oke:
    nodePools:
      system:
        shape: VM.Standard.E5.Flex
        size: 1
      workers:
        - name: l40s
          gpuType: l40s
          availabilityDomains: [3]
          size: 1
          taints:
            - nodewright.nvidia.com=runtime-required:NoSchedule
            - nvidia.com/gpu:NoSchedule
